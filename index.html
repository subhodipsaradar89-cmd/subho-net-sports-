function render(list){
    const g=document.getElementById('channels');
    g.innerHTML='';
    list.forEach(ch=>{
        const d=document.createElement('div');
        d.className='channel';
        d.innerHTML=`
            <div><span class="badge">SPORTS</span><span class="live">● LIVE</span></div>
            <h3>${ch.name}</h3>
            <button onclick="watch('${ch.id}')">▶ WATCH NOW</button>
        `;
        g.appendChild(d);
    });
}

function watch(id){
    const ch=channels.find(c=>c.id===id);
    if(!ch)return;
    const p=new URLSearchParams({
        id:ch.id,name:ch.name,
        stream_url:ch.stream_url,
        key_id:ch.key_id,key:ch.key,cookie:ch.cookie
    });
    window.open('player.html?'+p.toString(),'_blank');
}

document.getElementById('search').oninput=function(){
    const q=this.value.toLowerCase();
    document.querySelectorAll('.channel').forEach(el=>{
        el.style.display=el.innerText.toLowerCase().includes(q)?'':'none';
    });
};

render(channels);
