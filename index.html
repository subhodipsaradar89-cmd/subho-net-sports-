<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>STAR SPORTS | SUBHO•NΞT•SPORTS</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, .08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(129, 140, 248, .08) 0%, transparent 50%);
        }

        /* ---------- HEADER ---------- */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, .4), transparent);
        }

        .logo-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .brand {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 0 40px rgba(56, 189, 248, .15);
        }

        .tagline {
            color: #64748b;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 600;
        }

        .page-title {
            text-align: center;
            padding: 10px 0 20px;
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        /* ---------- CONTAINER ---------- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
            flex: 1;
        }

        /* ---------- LIVE BAR ---------- */
        .live-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 8px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            margin-bottom: 16px;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, .5);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .4;
                transform: scale(.6);
            }
        }

        .live-text {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .channel-count {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, .06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .06);
        }

        /* ---------- SEARCH ---------- */
        .search-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .search-wrap input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: rgba(255, 255, 255, .04);
            color: #fff;
            font-size: 14px;
            transition: all .3s;
            outline: none;
        }

        .search-wrap input::placeholder {
            color: #475569;
        }

        .search-wrap input:focus {
            border-color: rgba(56, 189, 248, .4);
            background: rgba(255, 255, 255, .07);
            box-shadow: 0 0 30px rgba(56, 189, 248, .06);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 18px;
        }

        /* ---------- CHANNEL GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 14px;
            padding-bottom: 30px;
        }

        /* ---------- CHANNEL CARD ---------- */
        .channel {
            background: linear-gradient(145deg, rgba(17, 24, 39, .96), rgba(7, 11, 19, .98));
            border-radius: 16px;
            padding: 18px 14px 14px;
            border: 1px solid rgba(255, 255, 255, .06);
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .channel::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(56, 189, 248, .08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .channel:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, .25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
        }

        .channel:active {
            transform: scale(.97);
        }

        .channel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .channel-badge {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #7dd3fc;
            background: rgba(56, 189, 248, .1);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, .1);
        }

        .channel-live {
            font-size: 8px;
            font-weight: 700;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .channel-live .mini-dot {
            width: 5px;
            height: 5px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 700;
            margin: 12px 0 14px;
            line-height: 1.3;
            position: relative;
            z-index: 1;
            color: #e2e8f0;
        }

        .watch-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            color: #020617;
            background: linear-gradient(135deg, #e2e8f0, #bae6fd);
            cursor: pointer;
            transition: all .3s;
            position: relative;
            z-index: 1;
        }

        .watch-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(56, 189, 248, .2);
        }

        .watch-btn:active {
            transform: scale(.96);
        }

        /* ---------- EMPTY STATE ---------- */
        .empty {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty span {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            padding: 20px 0 30px;
            border-top: 1px solid rgba(255, 255, 255, .04);
            margin-top: 10px;
        }

        .footer .powered {
            color: #475569;
            font-size: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .footer .brand-footer {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 6px 0 10px;
        }

        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(34, 197, 94, .2);
            color: #4ade80;
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            transition: all .3s;
            background: rgba(34, 197, 94, .05);
        }

        .whatsapp-link:hover {
            background: rgba(34, 197, 94, .1);
            border-color: rgba(34, 197, 94, .4);
        }

        /* ---------- BACK BUTTON ---------- */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: color .3s;
        }

        .back-btn:hover {
            color: #38bdf8;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 520px) {
            .header {
                padding: 28px 16px 22px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .channel {
                padding: 14px 12px 12px;
                min-height: 120px;
            }
            .channel-name {
                font-size: 13px;
            }
            .watch-btn {
                font-size: 10px;
                padding: 8px;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <span class="logo-icon">🏆</span>
        <div class="brand">SUBHO•NΞT•SPORTS</div>
        <div class="tagline">PREMIUM SPORTS NETWORK</div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">

        <!-- BACK BUTTON -->
        <a href="index.html" class="back-btn">⬅ Back to Home</a>

        <!-- PAGE TITLE -->
        <div class="page-title">⭐ STAR SPORTS</div>

        <!-- LIVE BAR -->
        <div class="live-bar">
            <span class="live-text">
                <span class="live-dot"></span> STAR SPORTS LIVE
            </span>
            <span class="channel-count" id="count">Loading...</span>
        </div>

        <!-- SEARCH -->
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search Star Sports channel...">
        </div>

        <!-- CHANNEL GRID -->
        <div class="grid" id="channels"></div>

        <!-- EMPTY STATE -->
        <div class="empty" id="empty">
            <span>⭐</span>
            No Star Sports channel found.
        </div>

    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <div class="powered">POWERED BY</div>
        <div class="brand-footer">SUBHO•NΞT•SPORTS</div>
        <a href="https://whatsapp.com/channel/0029Vb8nauA84OmAXcNW3U26" target="_blank" class="whatsapp-link">
            ✆ JOIN WHATSAPP CHANNEL
        </a>
    </div>

    <script>
        // ---------- JSON API ----------
        const JSON_API = "https://sonujson-v3.pages.dev/Data/sports.json";

        // ---------- STAR SPORTS FILTER ----------
        function isStarSportsChannel(name) {
            const n = name.toLowerCase();
            return n.includes('star sports');
        }

        // ---------- FETCH & RENDER ----------
        async function loadChannels() {
            const grid = document.getElementById('channels');
            const count = document.getElementById('count');
            const empty = document.getElementById('empty');

            try {
                const res = await fetch(JSON_API, { cache: 'no-store' });
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                const allChannels = data.channels || [];
                const starChannels = allChannels.filter(ch => isStarSportsChannel(ch.name));

                if (starChannels.length === 0) {
                    empty.style.display = 'block';
                    count.textContent = '0 CHANNELS';
                    return;
                }

                count.textContent = starChannels.length + ' CHANNELS';
                renderChannels(starChannels);

            } catch (err) {
                console.error(err);
                count.textContent = '⚠ OFFLINE';
                empty.style.display = 'block';
                empty.innerHTML = '<span>⚠</span> Unable to load channels. Check internet.';
            }
        }

        function renderChannels(channels) {
            const grid = document.getElementById('channels');
            const empty = document.getElementById('empty');
            grid.innerHTML = '';
            empty.style.display = 'none';

            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel';
                card.innerHTML = `
                        <div>
                            <div class="channel-top">
                                <span class="channel-badge">⭐ STAR SPORTS</span>
                                <span class="channel-live"><span class="mini-dot"></span> LIVE</span>
                            </div>
                            <div class="channel-name">${ch.name}</div>
                        </div>
                        <button class="watch-btn" data-id="${ch.id}">▶ WATCH NOW</button>
                    `;

                card.querySelector('.watch-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const channel = channels.find(c => c.id === id);
                    if (!channel) return;

                    const params = new URLSearchParams({
                        id: channel.id,
                        name: channel.name,
                        stream_url: channel.stream_url || '',
                        key_id: channel.key_id || '',
                        key: channel.key || '',
                        cookie: channel.cookie || ''
                    });
                    window.open('player.html?' + params.toString(), '_blank');
                });

                // Click on card also triggers watch
                card.addEventListener('click', function() {
                    this.querySelector('.watch-btn').click();
                });

                grid.appendChild(card);
            });
        }

        // ---------- SEARCH ----------
        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.channel');
            let visible = 0;
            cards.forEach(card => {
                const name = card.querySelector('.channel-name').textContent.toLowerCase();
                if (name.includes(query)) {
                    card.style.display = 'flex';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('empty').style.display = visible === 0 ? 'block' : 'none';
            document.getElementById('count').textContent = visible + ' CHANNELS';
        });

        // ---------- START ----------
        loadChannels();
    </script>

</body>
</html>
