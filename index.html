function render(list){
    const container=document.getElementById('channels');
    const empty=document.getElementById('empty');
    const count=document.getElementById('count');
    container.innerHTML='';
    if(list.length===0){count.textContent='0 CHANNELS';empty.style.display='block';return;}
    empty.style.display='none';
    count.textContent=list.length+' CHANNELS';
    list.forEach(ch=>{
        const card=document.createElement('div');
        card.className='channel';
        card.innerHTML=`
            <div>
                <div class="channel-top">
                    <span class="channel-badge">SPORTS</span>
                    <span class="channel-live"><span class="mini-dot"></span> LIVE</span>
                </div>
                <div class="channel-name">${ch.name}</div>
            </div>
            <button class="watch-btn" data-id="${ch.id}">▶ WATCH NOW</button>
        `;
        card.querySelector('.watch-btn').addEventListener('click',function(e){
            e.stopPropagation();
            const id=this.dataset.id;
            const channel=list.find(c=>c.id===id);
            if(!channel)return;
            const params=new URLSearchParams({
                id:channel.id,name:channel.name,
                stream_url:channel.stream_url||'',
                key_id:channel.key_id||'',
                key:channel.key||'',
                cookie:channel.cookie||''
            });
            window.open('player.html?'+params.toString(),'_blank');
        });
        card.addEventListener('click',function(){this.querySelector('.watch-btn').click();});
        container.appendChild(card);
    });
}

document.getElementById('search').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    const cards=document.querySelectorAll('.channel');
    let visible=0;
    cards.forEach(card=>{
        const name=card.querySelector('.channel-name').textContent.toLowerCase();
        if(name.includes(q)){card.style.display='flex';visible++;}
        else{card.style.display='none';}
    });
    document.getElementById('empty').style.display=visible===0?'block':'none';
    document.getElementById('count').textContent=visible+' CHANNELS';
});
